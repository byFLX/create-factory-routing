modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "createfactorycontroller"
type = "optional"
# Compiled against 1.2.3. 1.2.1 and 1.2.2 declare every member this addon mixes into with the same
# signatures -- checked against the published jars -- so the range is closed over exactly those
# three builds. 1.2.0 and older still use the pre-"component.gauge" package layout and do not work.
# The mod reports itself as "1.2.3-neoforge-1.21.1", which the loader orders above plain 1.2.3, so
# the bounds carry the full version strings -- and an installed but out-of-range optional
# dependency aborts loading rather than being skipped.
versionRange = "[1.2.1-neoforge-1.21.1,1.2.3-neoforge-1.21.1]"
ordering = "AFTER"
side = "BOTH"
