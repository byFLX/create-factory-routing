modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "createfactorycontroller"
type = "optional"
# Pinned to the exact tested build. The mod reports itself as "1.1.1-neoforge-1.21.1", which the
# loader orders above plain 1.1.1, so "[1.1.1]" would exclude it -- and an installed but
# out-of-range optional dependency aborts loading rather than being skipped.
versionRange = "[1.1.1-neoforge-1.21.1]"
ordering = "AFTER"
side = "BOTH"
